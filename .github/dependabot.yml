# Keep both published SDKs and the workflows that release them current.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/javascript"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/python"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/golang"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/golang/integrations/googleadk"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/web"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/python"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/tests/postgres"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/web"
    schedule:
      interval: "weekly"
