name: Concurrency stress

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  races:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bursar
      BURSAR_ALLOW_DATABASE_RESET: "1"
      BURSAR_RACE_ITERATIONS: "20"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Start provider-neutral PostgreSQL
        run: |
          docker build -t bursar/postgres-test:ci tests/postgres
          docker run --detach --name bursar-postgres \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_DB=bursar \
            --publish 5432:5432 \
            bursar/postgres-test:ci -c max_connections=500
          for attempt in $(seq 1 30); do
            if docker exec bursar-postgres pg_isready -U postgres -d bursar; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: pip install -e "python/[test,postgres]"
      - working-directory: javascript
        run: bun ci --ignore-scripts
      - name: Python race subset
        working-directory: python
        run: pytest -m concurrency -q
      - name: JavaScript race subset
        working-directory: javascript
        run: |
          for iteration in $(seq 1 20); do
            bunx --no-install vitest run tests/store-integration.test.ts tests/billing-integration.test.ts -t concurrent
          done
