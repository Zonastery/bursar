name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel superseded PR/branch runs, but never cancel a release tag: stopping a
# publish midway can leave the PyPI, npm, and GitHub releases out of sync.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Least-privilege default for every job. Jobs that need more (the publish jobs)
# opt in explicitly.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install ruff sqlfluff==4.2.2
      - working-directory: python
        run: |
          ruff check src/ tests/ scripts/
          ruff format --check src/ tests/ scripts/
      - run: sqlfluff lint python/src/bursar/sql --config .sqlfluff --nocolor

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e "python/[test,postgres]"
      - working-directory: python
        run: pyright src/

  test:
    runs-on: ubuntu-latest
    env:
      BURSAR_REQUIRE_POSTGRES_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        # Supported Python runtimes.
        python-version: ["3.12", "3.13"]
    # The fixture builds Bursar's upstream-PostgreSQL test image and starts it
    # through testcontainers, so integration tests run against the same
    # extension set locally and in CI.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e "python/[test,postgres]"
      # Loads the shared expression vectors and runs the real-Postgres
      # concurrency and double-spend suite through testcontainers.
      # --cov-fail-under is the floor in pyproject.toml (ratchet up, never down).
      - working-directory: python
        run: pytest --cov=bursar --cov-branch --cov-report=term-missing --cov-report=xml
      - name: Verify pricing JSON schema is up to date
        run: |
          python python/scripts/generate_pricing_json_schema.py
          git diff --exit-code -- \
            docs/pricing-config.schema.json \
            javascript/src/generated/pricing-config.schema.json \
            python/src/bursar/sql/001_schema_and_types.sql
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.python-version == '3.13'
        with:
          name: python-coverage-report
          path: python/coverage.xml

  js-test:
    runs-on: ubuntu-latest
    env:
      BURSAR_REQUIRE_POSTGRES_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        # Supported Node.js LTS/current runtimes.
        node-version: ["22", "24"]
    # Vitest global setup builds Bursar's upstream-PostgreSQL image and manages
    # its container lifecycle through testcontainers.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Cache Bun install artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('javascript/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-
      # Also loads the shared expression vectors used by the Python suite.
      # Coverage thresholds live in vitest.config.ts (ratchet up, never down).
      - working-directory: javascript
        run: |
          bun ci --ignore-scripts
          bunx --no-install vitest run --coverage --pool=forks --no-file-parallelism --maxWorkers=1
          bunx --no-install vitest --config vitest.providers.config.ts run --coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node-version == '22'
        with:
          name: js-coverage-report
          path: javascript/coverage/

  js-quality:
    name: JavaScript quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Cache Bun install artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('javascript/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-
      - working-directory: javascript
        run: |
          bun ci --ignore-scripts
          bun run generate:config-types
          git diff --exit-code -- src/generated/pricing-config.types.ts
          bun run typecheck
          bun run lint
          bun run format
          bun run knip

  sdk-contract-parity:
    name: Cross-SDK deterministic contract parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Cache Bun install artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('javascript/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-
      - run: pip install -e "python/[test]"
      - working-directory: javascript
        run: bun ci --ignore-scripts && bun run build
      - name: Export and compare shared contract vectors
        run: |
          python python/scripts/export_contract_results.py /tmp/bursar-python-contract.json
          node javascript/scripts/export-contract-results.mjs /tmp/bursar-javascript-contract.json
          python - <<'PY'
          import json
          from pathlib import Path
          py = json.loads(Path('/tmp/bursar-python-contract.json').read_text())
          js = json.loads(Path('/tmp/bursar-javascript-contract.json').read_text())
          if py != js:
              raise SystemExit(f"Python/JavaScript contract mismatch:\nPY={py}\nJS={js}")
          print("Python and JavaScript contract vectors match")
          PY

  package-smoke:
    name: Published artifact smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Cache Bun install artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('javascript/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-
      - working-directory: javascript
        run: |
          bun ci --ignore-scripts
          bun run build
          mkdir -p /tmp/bursar-npm
          bun pm pack --destination /tmp/bursar-npm --ignore-scripts
      - name: Install npm artifact in a clean consumer
        run: |
          consumer=$(mktemp -d)
          cd "$consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-save /tmp/bursar-npm/*.tgz
          node --input-type=module -e 'const sdk = await import("@zonastery/bursar"); if (!sdk.Bursar || !sdk.PricingEngine) process.exit(1)'
      - name: Build and import Python wheel in a clean consumer
        run: |
          mkdir -p /tmp/bursar-wheel
          python -m pip wheel --no-deps --wheel-dir /tmp/bursar-wheel ./python
          python -m venv /tmp/bursar-python-consumer
          /tmp/bursar-python-consumer/bin/pip install /tmp/bursar-wheel/*.whl
          /tmp/bursar-python-consumer/bin/python -c 'import bursar; assert bursar.Bursar and bursar.PricingEngine'

  # Both SDK test suites load the same tests/parity/expression_cases.json
  # fixture, so a divergence between the Python and JS engines fails one of
  # them. This aggregating job makes that
  # explicit and is a convenient single required status check.
  parity-gate:
    needs: [test, js-test, sdk-contract-parity]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Python and JS suites both passed against tests/parity/expression_cases.json — engines agree."

  # ── Release ───────────────────────────────────────────────────────────────
  # Validate the complete release before either registry is touched. Publishing
  # is ordered PyPI -> npm -> GitHub Release -> Context7 and every step is safe
  # to rerun, so an outage can be recovered without changing the immutable tag.

  release-preflight:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, typecheck, test, js-test, js-quality, sdk-contract-parity, package-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify tag and SDK versions agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          python_version = tomllib.loads(Path("python/pyproject.toml").read_text())["project"]["version"]
          javascript_version = json.loads(Path("javascript/package.json").read_text())["version"]
          release_tag = os.environ["RELEASE_TAG"]
          expected_tag = f"v{python_version}"

          if python_version != javascript_version:
              raise SystemExit(
                  f"SDK version mismatch: Python={python_version}, JavaScript={javascript_version}"
              )
          if release_tag != expected_tag:
              raise SystemExit(f"release tag {release_tag!r} must equal {expected_tag!r}")
          PY

  release-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-preflight]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # PyPI OIDC trusted publishing
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install uv
      - working-directory: python
        run: |
          uv build
          uv publish --check-url https://pypi.org/simple

  release-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-pypi]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Cache Bun install artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('javascript/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-
      # npm >= 11.5.1 supports OIDC trusted publishing; the npm CLI mints a
      # short-lived token from the id-token, so no NODE_AUTH_TOKEN is required.
      - run: npm install -g npm@latest
      - working-directory: javascript
        run: |
          bun ci --ignore-scripts
          bun run build
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          published_integrity="$(npm view "${package_name}@${package_version}" dist.integrity 2>/dev/null || true)"
          if [ -n "$published_integrity" ]; then
            local_integrity="$(npm pack --dry-run --json | node -e 'let s=""; process.stdin.on("data", c => s += c).on("end", () => console.log(JSON.parse(s)[0].integrity))')"
            if [ "$local_integrity" != "$published_integrity" ]; then
              echo "npm ${package_name}@${package_version} already exists with different contents" >&2
              exit 1
            fi
            echo "npm ${package_name}@${package_version} already contains this artifact; skipping"
          else
            npm publish --access public --provenance
          fi

  release-github:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; skipping"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "Bursar $RELEASE_TAG"
          fi

  refresh-context7:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-github]
    uses: ./.github/workflows/context7-refresh.yml
    secrets: inherit
