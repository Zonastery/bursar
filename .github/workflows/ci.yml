name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel superseded PR/branch runs, but never cancel a release tag: stopping a
# publish midway can leave the PyPI, npm, and GitHub releases out of sync.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Least-privilege default for every job. Jobs that need more (the publish jobs)
# opt in explicitly.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install ruff sqlfluff==4.2.2
      - working-directory: python
        run: |
          ruff check src/ tests/ scripts/
          ruff format --check src/ tests/ scripts/
      - run: sqlfluff lint python/src/bursar/sql --config .sqlfluff --nocolor

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e "python/[test,postgres]"
      - working-directory: python
        run: pyright src/

  test:
    name: Python ${{ matrix.python-version }} / PostgreSQL ${{ matrix.postgres.major }}
    runs-on: ubuntu-latest
    env:
      BURSAR_REQUIRE_POSTGRES_TESTS: "1"
      BURSAR_TEST_PG_IMAGE: ${{ matrix.postgres.test_image }}
    strategy:
      fail-fast: false
      matrix:
        # Supported Python runtimes and PostgreSQL majors. Base images are
        # immutable, multi-architecture OCI indexes; the Dockerfile separately
        # verifies the matching pg_jsonschema package checksum.
        python-version: ["3.12", "3.13"]
        postgres:
          - major: "16"
            base_image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
            test_image: bursar/postgres-test:16.10-pg-jsonschema-0.3.4
          - major: "17"
            base_image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
            test_image: bursar/postgres-test:17.10-pg-jsonschema-0.3.4
    # CI builds the selected immutable base explicitly; the fixture then owns
    # only the container lifecycle through Testcontainers.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build pinned PostgreSQL ${{ matrix.postgres.major }} test image
        env:
          POSTGRES_IMAGE: ${{ matrix.postgres.base_image }}
        run: |
          docker build \
            --build-arg "POSTGRES_IMAGE=${POSTGRES_IMAGE}" \
            --tag "${BURSAR_TEST_PG_IMAGE}" \
            tests/postgres
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e "python/[test,postgres]"
      # Loads the shared expression vectors and runs the real-Postgres
      # concurrency and double-spend suite through testcontainers.
      # --cov-fail-under is the floor in pyproject.toml (ratchet up, never down).
      - working-directory: python
        run: pytest --cov=bursar --cov-branch --cov-report=term-missing --cov-report=xml
      - name: Verify pricing JSON schema is up to date
        run: |
          python python/scripts/generate_pricing_json_schema.py
          git diff --exit-code -- \
            docs/pricing-config.schema.json \
            javascript/src/generated/pricing-config.schema.json \
            golang/internal/config/pricing-config.schema.json \
            python/src/bursar/sql/001_schema_and_types.sql
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.python-version == '3.13' && matrix.postgres.major == '17'
        with:
          name: python-coverage-report
          path: python/coverage.xml

  js-test:
    name: Node.js ${{ matrix.node-version }} / PostgreSQL ${{ matrix.postgres.major }}
    runs-on: ubuntu-latest
    env:
      BURSAR_REQUIRE_POSTGRES_TESTS: "1"
      BURSAR_TEST_PG_IMAGE: ${{ matrix.postgres.test_image }}
    strategy:
      fail-fast: false
      matrix:
        # Supported Node.js runtimes and the same PostgreSQL support boundary
        # exercised by the Python SDK.
        node-version: ["22", "24"]
        postgres:
          - major: "16"
            base_image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
            test_image: bursar/postgres-test:16.10-pg-jsonschema-0.3.4
          - major: "17"
            base_image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
            test_image: bursar/postgres-test:17.10-pg-jsonschema-0.3.4
    # Vitest global setup starts the prebuilt image and owns its lifecycle.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build pinned PostgreSQL ${{ matrix.postgres.major }} test image
        env:
          POSTGRES_IMAGE: ${{ matrix.postgres.base_image }}
        run: |
          docker build \
            --build-arg "POSTGRES_IMAGE=${POSTGRES_IMAGE}" \
            --tag "${BURSAR_TEST_PG_IMAGE}" \
            tests/postgres
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Cache Bun install artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('javascript/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-
      # Also loads the shared expression vectors used by the Python suite.
      # Coverage thresholds live in vitest.config.ts (ratchet up, never down).
      - working-directory: javascript
        run: |
          bun ci --ignore-scripts
          bunx --no-install vitest run --coverage --pool=forks --no-file-parallelism --maxWorkers=1
          bunx --no-install vitest --config vitest.providers.config.ts run --coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node-version == '22' && matrix.postgres.major == '17'
        with:
          name: js-coverage-report
          path: javascript/coverage/

  js-quality:
    name: JavaScript quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Cache Bun install artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('javascript/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-
      - working-directory: javascript
        run: |
          bun ci --ignore-scripts
          bun run generate:config-types
          git diff --exit-code -- src/generated/pricing-config.types.ts
          bun run typecheck
          bun run lint
          bun run format
          bun run knip

  go-quality:
    name: Go quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: golang/go.sum
      - name: Verify module metadata and formatting
        working-directory: golang
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          files="$(git ls-files '*.go')"
          if [ -n "$files" ]; then
            test -z "$(gofmt -l $files)"
          fi
      - run: go vet ./...
        working-directory: golang

  go-test:
    name: Go ${{ matrix.go-version }} / PostgreSQL ${{ matrix.postgres.major }}
    runs-on: ubuntu-latest
    env:
      BURSAR_REQUIRE_POSTGRES_TESTS: "1"
      BURSAR_TEST_PG_IMAGE: ${{ matrix.postgres.test_image }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.x", "1.26.x"]
        postgres:
          - major: "16"
            base_image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
            test_image: bursar/postgres-test:16.10-pg-jsonschema-0.3.4
          - major: "17"
            base_image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
            test_image: bursar/postgres-test:17.10-pg-jsonschema-0.3.4
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build pinned PostgreSQL ${{ matrix.postgres.major }} test image
        env:
          POSTGRES_IMAGE: ${{ matrix.postgres.base_image }}
        run: |
          docker build \
            --build-arg "POSTGRES_IMAGE=${POSTGRES_IMAGE}" \
            --tag "${BURSAR_TEST_PG_IMAGE}" \
            tests/postgres
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: golang/go.sum
      - run: go test -race -count=1 ./...
        working-directory: golang

  sdk-contract-parity:
    name: Cross-SDK deterministic contract parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Cache Bun install artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('javascript/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-
      - run: pip install -e "python/[test]"
      - working-directory: javascript
        run: bun ci --ignore-scripts && bun run build
      - name: Export and compare shared contract vectors
        run: |
          python python/scripts/export_contract_results.py /tmp/bursar-python-contract.json
          node javascript/scripts/export-contract-results.mjs /tmp/bursar-javascript-contract.json
          python - <<'PY'
          import json
          from pathlib import Path
          py = json.loads(Path('/tmp/bursar-python-contract.json').read_text())
          js = json.loads(Path('/tmp/bursar-javascript-contract.json').read_text())
          if py != js:
              raise SystemExit(f"Python/JavaScript contract mismatch:\nPY={py}\nJS={js}")
          print("Python and JavaScript contract vectors match")
          PY

  package-smoke:
    name: Published artifact and Go package smoke test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bursar
      BURSAR_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bursar
      BURSAR_OPERATOR_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bursar
      BURSAR_TENANT_ID: 00000000-0000-4000-8000-000000000201
      BURSAR_PROVIDER_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: golang/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Cache Bun install artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('javascript/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-
      - name: Start package-smoke PostgreSQL
        run: |
          docker build --tag bursar/postgres-test:package-smoke tests/postgres
          docker run --detach --name bursar-package-smoke-postgres \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_DB=bursar \
            --publish 5432:5432 \
            bursar/postgres-test:package-smoke
          for attempt in $(seq 1 30); do
            if docker exec bursar-package-smoke-postgres pg_isready -U postgres -d bursar; then
              exit 0
            fi
            sleep 1
          done
          docker logs bursar-package-smoke-postgres
          exit 1
      - working-directory: javascript
        run: |
          bun ci --ignore-scripts
          bun run build
          mkdir -p /tmp/bursar-npm
          bun pm pack --destination /tmp/bursar-npm --ignore-scripts
      - name: Build and exercise Python wheel in a clean consumer
        run: |
          mkdir -p /tmp/bursar-wheel
          python -m pip wheel --no-deps --wheel-dir /tmp/bursar-wheel ./python
          python -m venv /tmp/bursar-python-consumer
          /tmp/bursar-python-consumer/bin/pip install /tmp/bursar-wheel/*.whl
          /tmp/bursar-python-consumer/bin/python -c 'import bursar; assert bursar.Bursar and bursar.PricingEngine'
          wheel=$(find /tmp/bursar-wheel -name '*.whl' -print -quit)
          /tmp/bursar-python-consumer/bin/pip install "${wheel}[postgres,s3,opentelemetry]"
          /tmp/bursar-python-consumer/bin/python -c 'from importlib.resources import files; import bursar.storage; import bursar.telemetry.opentelemetry; assert (files("bursar") / "sql" / "030_operator_runtime_role.sql").is_file()'
          /tmp/bursar-python-consumer/bin/bursar migrate
          /tmp/bursar-python-consumer/bin/bursar tenant bootstrap package-smoke \
            .github/package-smoke/pricing.json \
            --id "$BURSAR_TENANT_ID" \
            --display-name "Package smoke" \
            --label initial
          /tmp/bursar-python-consumer/bin/python .github/package-smoke/python-postgres-smoke.py
      - name: Install and exercise npm artifact in a clean consumer
        run: |
          mkdir -p /tmp/bursar-npm-consumer
          cd /tmp/bursar-npm-consumer
          npm init -y >/dev/null
          npm pkg set type=module
          npm install --ignore-scripts --no-save /tmp/bursar-npm/*.tgz typescript
          cp "$GITHUB_WORKSPACE"/.github/package-smoke/npm-consumer-base.ts .
          cp "$GITHUB_WORKSPACE"/.github/package-smoke/npm-optional-peer-isolation.mjs .
          cp "$GITHUB_WORKSPACE"/.github/package-smoke/tsconfig.base.json .
          npx --no-install tsc -p tsconfig.base.json
          node npm-optional-peer-isolation.mjs
          npm install --ignore-scripts --no-save /tmp/bursar-npm/*.tgz typescript pg decimal.js @opentelemetry/api
          cp "$GITHUB_WORKSPACE"/.github/package-smoke/npm-consumer-opentelemetry.ts .
          cp "$GITHUB_WORKSPACE"/.github/package-smoke/npm-postgres-smoke.mjs .
          cp "$GITHUB_WORKSPACE"/.github/package-smoke/tsconfig.opentelemetry.json .
          npx --no-install tsc -p tsconfig.opentelemetry.json
          node --input-type=module -e 'const telemetry = await import("@zonastery/bursar/opentelemetry"); if (!telemetry.createOpenTelemetryInstrumentation) process.exit(1)'
          node npm-postgres-smoke.mjs
      - name: Compile the Go package as a clean consumer
        run: |
          mkdir -p /tmp/bursar-go-consumer
          cd /tmp/bursar-go-consumer
          go mod init example.com/bursar-smoke
          go mod edit -require=github.com/Zonastery/bursar/golang/v2@v2.0.2
          go mod edit -replace=github.com/Zonastery/bursar/golang/v2="$GITHUB_WORKSPACE/golang"
          cat > main.go <<'EOF'
          package main

          import (
              "context"
              "os"

              bursar "github.com/Zonastery/bursar/golang/v2"
          )

          func main() {
              ctx := context.Background()
              store, err := bursar.NewPostgresStore(ctx, os.Getenv("DATABASE_URL"), bursar.PostgresStoreOptions{
                  TenantID:            os.Getenv("BURSAR_TENANT_ID"),
                  ProviderEnvironment: bursar.ProviderEnvironmentTest,
              })
              if err != nil {
                  panic(err)
              }
              defer store.Close()

              sdk, err := bursar.New(bursar.Options{CreditStore: store})
              if err != nil {
                  panic(err)
              }
              if err := sdk.LoadCatalog(ctx); err != nil {
                  panic(err)
              }
          }
          EOF
          gofmt -w main.go
          go mod tidy
          go run .
      - name: Stop package-smoke PostgreSQL
        if: always()
        run: docker rm --force bursar-package-smoke-postgres || true

  # All SDK test suites load the same tests/parity/expression_cases.json
  # fixture, so a divergence between the Python, JS, and Go engines fails one
  # of them. This aggregating job makes that
  # explicit and is a convenient single required status check.
  parity-gate:
    needs: [test, js-test, go-test, sdk-contract-parity]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Python, JS, and Go suites passed against tests/parity/expression_cases.json — engines agree."

  # ── Release ───────────────────────────────────────────────────────────────
  # Validate the complete release before either registry is touched. Publishing
  # is ordered PyPI -> npm -> GitHub Release and every step is safe to rerun, so
  # an outage can be recovered without changing the immutable tag. Context7 is
  # refreshed afterward on a best-effort basis and cannot fail the release.

  release-preflight:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      [
        lint,
        typecheck,
        test,
        js-test,
        js-quality,
        go-quality,
        go-test,
        sdk-contract-parity,
        package-smoke,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify tag and SDK module versions agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          python_version = tomllib.loads(Path("python/pyproject.toml").read_text())["project"]["version"]
          javascript_version = json.loads(Path("javascript/package.json").read_text())["version"]
          go_module = next(
              (
                  line.split()[1]
                  for line in Path("golang/go.mod").read_text().splitlines()
                  if line.startswith("module ")
              ),
              None,
          )
          release_tag = os.environ["RELEASE_TAG"]
          expected_tag = f"v{python_version}"
          expected_go_module = f"github.com/Zonastery/bursar/golang/v{python_version.split('.', 1)[0]}"

          if python_version != javascript_version:
              raise SystemExit(
                  f"SDK version mismatch: Python={python_version}, JavaScript={javascript_version}"
              )
          if release_tag != expected_tag:
              raise SystemExit(f"release tag {release_tag!r} must equal {expected_tag!r}")
          if go_module != expected_go_module:
              raise SystemExit(
                  f"Go module {go_module!r} must use the matching semantic import path "
                  f"{expected_go_module!r}"
              )
          PY

  release-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-preflight]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # PyPI OIDC trusted publishing
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install uv
      - working-directory: python
        run: |
          uv build
          uv publish --check-url https://pypi.org/simple

  release-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-pypi]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Cache Bun install artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('javascript/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-
      # npm >= 11.5.1 supports OIDC trusted publishing; the npm CLI mints a
      # short-lived token from the id-token, so no NODE_AUTH_TOKEN is required.
      - run: npm install -g npm@latest
      - working-directory: javascript
        run: |
          bun ci --ignore-scripts
          bun run build
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          published_integrity="$(npm view "${package_name}@${package_version}" dist.integrity 2>/dev/null || true)"
          if [ -n "$published_integrity" ]; then
            local_integrity="$(npm pack --dry-run --json | node -e 'let s=""; process.stdin.on("data", c => s += c).on("end", () => console.log(JSON.parse(s)[0].integrity))')"
            if [ "$local_integrity" != "$published_integrity" ]; then
              echo "npm ${package_name}@${package_version} already exists with different contents" >&2
              exit 1
            fi
            echo "npm ${package_name}@${package_version} already contains this artifact; skipping"
          else
            npm publish --access public --provenance
          fi

  release-github:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; skipping"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "Bursar $RELEASE_TAG"
          fi

  refresh-context7:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-github]
    uses: ./.github/workflows/context7-refresh.yml
    secrets: inherit
