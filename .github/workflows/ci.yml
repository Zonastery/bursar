name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel superseded PR/branch runs, but NEVER cancel a release (tag) run — a
# half-cancelled publish desyncs the PyPI/npm registries (audit H13).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Least-privilege default for every job. Jobs that need more (the publish jobs)
# opt in explicitly.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install ruff sqlfluff==4.2.2
      - working-directory: python
        run: ruff check src/ tests/
      - run: sqlfluff lint python/src/bursar/sql --config .sqlfluff --nocolor

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e "python/[test,postgres]"
      - working-directory: python
        run: pyright src/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported Python runtimes.
        python-version: ["3.12", "3.13"]
    # Real Postgres so the store/manager/SQL integration tests RUN (not skip).
    # A bare container is enough: the conftest.py fixtures bootstrap the `auth`
    # stubs/roles and apply python/src/bursar/sql/*.sql themselves.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bursar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # conftest.py resolves a real Postgres from DATABASE_URL first, then the
      # legacy BURSAR_TEST_PG_URL. Setting it makes the integration tests
      # (concurrency / double-spend / idempotency / migration idempotency)
      # FAIL rather than skip when something regresses (acceptance §8).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bursar
      BURSAR_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/bursar
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e "python/[test,postgres]"
      # Loads tests/parity/expression_cases.json (parity gate, §7) AND runs the
      # real-Postgres concurrency/double-spend suite via the DATABASE_URL above.
      # --cov-fail-under is the floor in pyproject.toml (ratchet up, never down).
      - working-directory: python
        run: pytest --cov=bursar --cov-branch --cov-report=term-missing --cov-report=xml
      - name: Verify pricing JSON schema is up to date
        run: |
          python python/scripts/generate_pricing_json_schema.py
          git diff --exit-code -- docs/pricing-config.schema.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.python-version == '3.13'
        with:
          name: python-coverage-report
          path: python/coverage.xml

  js-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported Node.js LTS/current runtimes.
        node-version: ["22", "24"]
    # GitHub Actions `services:` manages the container lifecycle, health gate
    # (pg_isready), and tear-down — no manual `docker run`/`docker stop` needed.
    # Default `max_connections=100` is ample: store-integration.test.ts uses a
    # SINGLE module-level `pg.Pool` with `max: 1` (see efeca43) and billing/
    # rls suites cap at `max: 3`, and `vitest.config.ts` forces `singleFork: true`
    # + `fileParallelism: false` so files run strictly sequentially. The real
    # leak was a missing `cs2.close()` in billing-integration.test.ts (fixed
    # 9fa7d72) — that's what eliminated the exhaustion, not raising the ceiling.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bursar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # store-integration.test.ts runs under describe.runIf(DATABASE_URL); with
      # this set the PostgresStore integration + concurrency tests RUN, not skip.
      # 127.0.0.1 rather than `localhost` to avoid a dual-stack DNS issue on
      # Node 20 where the IPv6 ::1 resolution sometimes fails (10bb89d).
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bursar
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      # Also loads tests/parity/expression_cases.json (parity gate, §7).
      # Coverage thresholds live in vitest.config.ts (ratchet up, never down).
      - working-directory: javascript
        run: |
          bun ci --ignore-scripts
          postgres_container=$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -1)
          docker exec "$postgres_container" psql -U postgres -d bursar -c "ALTER SYSTEM SET max_connections = 500"
          docker restart "$postgres_container"
          for attempt in $(seq 1 30); do
            if docker exec "$postgres_container" pg_isready -U postgres -d bursar >/dev/null 2>&1; then break; fi
            sleep 1
          done
          bunx --no-install vitest run --coverage --pool=forks --no-file-parallelism --maxWorkers=1 --minWorkers=1
          bunx --no-install vitest --config vitest.providers.config.ts run --coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.node-version == '22'
        with:
          name: js-coverage-report
          path: javascript/coverage/

  js-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - working-directory: javascript
        run: |
          bun ci --ignore-scripts
          bun run typecheck

  sdk-contract-parity:
    name: Cross-SDK deterministic contract parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: pip install -e "python/[test]"
      - working-directory: javascript
        run: bun ci --ignore-scripts && bun run build
      - name: Export and compare shared contract vectors
        run: |
          python python/scripts/export_contract_results.py /tmp/bursar-python-contract.json
          node javascript/scripts/export-contract-results.mjs /tmp/bursar-javascript-contract.json
          python - <<'PY'
          import json
          from pathlib import Path
          py = json.loads(Path('/tmp/bursar-python-contract.json').read_text())
          js = json.loads(Path('/tmp/bursar-javascript-contract.json').read_text())
          if py != js:
              raise SystemExit(f"Python/JavaScript contract mismatch:\nPY={py}\nJS={js}")
          print("Python and JavaScript contract vectors match")
          PY

  package-smoke:
    name: Published artifact smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - working-directory: javascript
        run: |
          bun ci --ignore-scripts
          bun run build
          mkdir -p /tmp/bursar-npm
          bun pm pack --destination /tmp/bursar-npm --ignore-scripts
      - name: Install npm artifact in a clean consumer
        run: |
          consumer=$(mktemp -d)
          cd "$consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-save /tmp/bursar-npm/*.tgz
          node --input-type=module -e 'const sdk = await import("@zonastery/bursar"); if (!sdk.Bursar || !sdk.PricingEngine) process.exit(1)'
      - name: Build and import Python wheel in a clean consumer
        run: |
          mkdir -p /tmp/bursar-wheel
          python -m pip wheel --no-deps --wheel-dir /tmp/bursar-wheel ./python
          python -m venv /tmp/bursar-python-consumer
          /tmp/bursar-python-consumer/bin/pip install /tmp/bursar-wheel/*.whl
          /tmp/bursar-python-consumer/bin/python -c 'import bursar; assert bursar.Bursar and bursar.PricingEngine'

  # Cross-SDK parity gate (§7): both SDK test suites load the SAME
  # tests/parity/expression_cases.json fixture, so a divergence between the
  # Python and JS engines fails one of them. This aggregating job makes that
  # explicit and is a convenient single required status check.
  parity-gate:
    needs: [test, js-test, sdk-contract-parity]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Python and JS suites both passed against tests/parity/expression_cases.json — engines agree."

  # ── Release ───────────────────────────────────────────────────────────────
  # Validate the complete release before either registry is touched. Publishing
  # is ordered PyPI -> npm and both steps are safe to rerun, so an npm outage can
  # be recovered without changing the immutable release tag.

  release-preflight:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, typecheck, test, js-test, js-typecheck, sdk-contract-parity, package-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Verify tag and SDK versions agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          python_version = tomllib.loads(Path("python/pyproject.toml").read_text())["project"]["version"]
          javascript_version = json.loads(Path("javascript/package.json").read_text())["version"]
          release_tag = os.environ["RELEASE_TAG"]
          expected_tag = f"v{python_version}"

          if python_version != javascript_version:
              raise SystemExit(
                  f"SDK version mismatch: Python={python_version}, JavaScript={javascript_version}"
              )
          if release_tag != expected_tag:
              raise SystemExit(f"release tag {release_tag!r} must equal {expected_tag!r}")
          PY

  release-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-preflight]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # PyPI OIDC trusted publishing
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: pip install uv
      - working-directory: python
        run: |
          uv build
          uv publish --check-url https://pypi.org/simple

  release-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-pypi]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      # npm >= 11.5.1 supports OIDC trusted publishing; the npm CLI mints a
      # short-lived token from the id-token, so no NODE_AUTH_TOKEN is required.
      - run: npm install -g npm@latest
      - working-directory: javascript
        run: |
          bun ci --ignore-scripts
          bun run build
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          published_integrity="$(npm view "${package_name}@${package_version}" dist.integrity 2>/dev/null || true)"
          if [ -n "$published_integrity" ]; then
            local_integrity="$(npm pack --dry-run --json | node -e 'let s=""; process.stdin.on("data", c => s += c).on("end", () => console.log(JSON.parse(s)[0].integrity))')"
            if [ "$local_integrity" != "$published_integrity" ]; then
              echo "npm ${package_name}@${package_version} already exists with different contents" >&2
              exit 1
            fi
            echo "npm ${package_name}@${package_version} already contains this artifact; skipping"
          else
            npm publish --access public --provenance
          fi
