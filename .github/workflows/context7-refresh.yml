name: Refresh Context7 Docs

on:
  release:
    types:
      - published
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh Context7 docs (optional)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Context7 refresh
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          CONTEXT7_LIBRARY: /${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${CONTEXT7_API_KEY:-}" ]; then
            echo "::notice::CONTEXT7_API_KEY is not configured; skipping the optional refresh"
            exit 0
          fi

          request_body="$(jq -cn --arg libraryName "$CONTEXT7_LIBRARY" '{libraryName: $libraryName}')"
          if ! curl --fail-with-body --retry 3 --retry-delay 2 --silent --show-error \
            --request POST \
            --url https://context7.com/api/v1/refresh \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $CONTEXT7_API_KEY" \
            --data "$request_body"; then
            printf '\n::warning::Context7 refresh failed; continuing because documentation indexing is optional\n'
          fi
