[project]
name = "bursar"
version = "2.0.3"
description = "Open-source PostgreSQL credit ledger, usage metering, and billing SDK for AI SaaS"
readme = "README.md"
license = "AGPL-3.0-only"
# Bursar supports the two Python versions exercised by its release matrix.
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.13.4,<3",
    "pyyaml>=6.0.3,<7",
    "tenacity>=9.1.4,<10",
]
keywords = [
    "ai-saas",
    "ai-billing",
    "usage-based-billing",
    "usage-metering",
    "prepaid-credits",
    "credit-ledger",
    "credits",
    "billing",
    "pricing",
    "llm",
    "llmops",
    "postgresql",
    "python",
    "stripe",
    "dodo-payments",
    "entitlements",
    "quotas",
    "finops",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://zonastery.github.io/bursar/"
Source = "https://github.com/Zonastery/bursar"
Documentation = "https://zonastery.github.io/bursar/"
Issues = "https://github.com/Zonastery/bursar/issues"
Changelog = "https://github.com/Zonastery/bursar/releases"
Security = "https://github.com/Zonastery/bursar/security/policy"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
bursar = "bursar.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
stripe = [
    "stripe>=15.5.0,<16",
]
dodo = [
    "dodopayments[webhooks]>=1.112.0,<2",
]
postgres = [
    "psycopg2-binary>=2.9.12",
]
s3 = [
    "boto3>=1.43.72,<2",
]
google-adk = [
    "google-adk>=2.7.0,<2.8.0",
]
opentelemetry = [
    "opentelemetry-api>=1.43.0,<2",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-repeat>=0.9.4",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
    "pyright>=1.1.411",
    "testcontainers[postgres]>=4.15.0",
    "hypothesis>=6.165.9",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "pyyaml>=6.0.3",
    "stripe>=15.5.0,<16",
    "dodopayments[webhooks]>=1.112.0,<2",
    "boto3>=1.43.72,<2",
    "google-adk>=2.7.0,<2.8.0",
    "opentelemetry-api>=1.43.0,<2",
]

[tool.setuptools.package-data]
bursar = ["sql/*.sql"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Keep the blocking baseline stable; preview rules must be opted into by exact code.
preview = false
explicit-preview-rules = true
select = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "C901",
    "DTZ",
    "E",
    "ERA",
    "F",
    "FLY",
    "FURB162",
    "I",
    "ICN",
    "LOG",
    "N",
    "PGH",
    "PIE",
    "PLR1714",
    "PT011",
    "PT012",
    "PT015",
    "PT017",
    "RET",
    "RUF012",
    "RUF013",
    "RUF021",
    "RUF032",
    "RUF043",
    "RUF059",
    "RUF061",
    "RUF100",
    "RUF101",
    "RUF102",
    "RUF103",
    "RUF104",
    "S",
    "SIM",
    "T10",
    "T20",
    "UP",
    "W",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["UP006"]
"**/test_*.py" = ["ANN", "ARG", "N", "RET", "S101", "S106", "SIM"]
# These files intentionally emit user-facing command output.
"scripts/*" = ["E501", "T201"]
"src/bursar/__main__.py" = ["T201"]
# Optional store capabilities keep their public keyword-compatible signatures
# while their default implementations fail with CapabilityNotSupportedError.
"src/bursar/credits/store.py" = ["ARG002"]
# The in-memory provider deliberately preserves provider protocol signatures.
"src/bursar/providers/mock/provider.py" = ["ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
# Match the package's minimum supported Python version.
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
exclude = ["**/__pycache__", "**/.venv/**", "**/.pytest_cache/**"]
useLibraryCodeForTypes = true
reportMissingImports = "error"
reportMissingModuleSource = "warning"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires a real Postgres (real DSN or a testcontainers-managed one)",
    "concurrency: exercises thread/connection races; slower, may be timeout-sensitive",
    "security: RLS / privilege-lockdown checks against real Postgres roles",
    "property: Hypothesis-driven property/invariant tests",
    "slow: long-running (property, high-repeat concurrency, migrations)",
]
addopts = "--timeout=120"

[tool.coverage.run]
source = ["bursar"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "def __repr__", "raise NotImplementedError"]
# Keep a release-blocking coverage floor; raise it as coverage improves.
# Coverage.py combines statements and branches in this threshold; statement
# coverage is tracked separately in the generated JSON report.
fail_under = 85

# Editable development dependencies, including notebook tooling.
[dependency-groups]
dev = [
    {include-group = "test-deps"},
    "ipykernel>=7.3.0",
    "lefthook>=2.1.10",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.0",
    "pglite>=1.0.14",
    "pytest-asyncio>=1.4.0",
]
# Extras and dependency groups are separate namespaces in uv. Keep this group
# aligned with the public `test` extra above.
test-deps = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-repeat>=0.9.4",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
    "pyright>=1.1.411",
    "testcontainers[postgres]>=4.15.0",
    "hypothesis>=6.165.9",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "pyyaml>=6.0.3",
    "stripe>=15.5.0,<16",
    "dodopayments[webhooks]>=1.112.0,<2",
    "boto3>=1.43.72,<2",
    "google-adk>=2.7.0,<2.8.0",
    "opentelemetry-api>=1.43.0,<2",
]
