[project]
name = "bursar"
version = "2.0.0"
description = "Usage metering, credits, subscriptions, and payments for AI applications"
readme = "README.md"
license = "AGPL-3.0-only"
# Bursar supports the two Python versions exercised by its release matrix.
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.13.4,<3",
    "python-dotenv>=1.2.2,<2",
    "pyyaml>=6.0.3,<7",
    "tenacity>=9.1.4,<10",
]
keywords = ["credits", "billing", "llm", "usage-metering", "pricing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://zonastery.github.io/bursar/"
Source = "https://github.com/Zonastery/bursar"
Documentation = "https://zonastery.github.io/bursar/"
Issues = "https://github.com/Zonastery/bursar/issues"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
bursar = "bursar.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
providers = [
    "stripe>=15.4.0",
    "dodopayments[webhooks]>=1.111.0",
]
postgres = [
    "psycopg2-binary>=2.9.12",
]
s3 = [
    "boto3>=1.43.66,<2",
]
google-adk = [
    "google-adk>=2.6.3,<2.7.0",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-repeat>=0.9.4",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
    "pyright>=1.1.411",
    "testcontainers[postgres]>=4.15.0",
    "hypothesis>=6.165.2",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "pyyaml>=6.0.3",
    "stripe>=15.4.0",
    "dodopayments[webhooks]>=1.111.0",
    "boto3>=1.43.66,<2",
    "google-adk>=2.6.3,<2.7.0",
]

[tool.setuptools.package-data]
bursar = ["sql/*.sql"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "ASYNC", "RUF100", "SIM", "RET", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["UP006"]
"**/test_*.py" = ["SIM", "RET", "N"]
"scripts/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
# Match the package's minimum supported Python version.
pythonVersion = "3.12"
typeCheckingMode = "standard"
useLibraryCodeForTypes = false
venvPath = "."
venv = ".venv"
exclude = ["**/__pycache__", "**/.venv/**", "**/.pytest_cache/**"]
reportMissingImports = "none"
reportMissingModuleSource = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:^BaseAgentConfig is deprecated and will be removed in future versions\\.:DeprecationWarning",
]
markers = [
    "integration: requires a real Postgres (real DSN or a testcontainers-managed one)",
    "concurrency: exercises thread/connection races; slower, may be timeout-sensitive",
    "security: RLS / privilege-lockdown checks against real Postgres roles",
    "property: Hypothesis-driven property/invariant tests",
    "slow: long-running (property, high-repeat concurrency, migrations)",
]
addopts = "--timeout=120"

[tool.coverage.run]
source = ["bursar"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "def __repr__", "raise NotImplementedError"]
# Keep a release-blocking coverage floor; raise it as coverage improves.
fail_under = 62

# Editable development dependencies, including notebook tooling.
[dependency-groups]
dev = [
    {include-group = "test-deps"},
    "ipykernel>=7.3.0",
    "lefthook>=2.1.10",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.0",
    "pglite>=1.0.14",
    "pytest-asyncio>=1.4.0",
]
# Extras and dependency groups are separate namespaces in uv. Keep this group
# aligned with the public `test` extra above.
test-deps = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-repeat>=0.9.4",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
    "pyright>=1.1.411",
    "testcontainers[postgres]>=4.15.0",
    "hypothesis>=6.165.2",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "pyyaml>=6.0.3",
    "stripe>=15.4.0",
    "dodopayments[webhooks]>=1.111.0",
    "boto3>=1.43.66,<2",
    "google-adk>=2.6.3,<2.7.0",
]
