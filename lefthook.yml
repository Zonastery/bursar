# Local git hooks. CI is the real gate; these hooks are a fast local
# convenience and are intentionally bypassable (`git commit --no-verify`).
#
# Pre-commit runs in CHECK mode only: it never rewrites and silently stages your
# files (the old `--fix` + `stage_fixed: true` could sneak unreviewed edits into
# a commit). When a check fails it prints the one-line fix command so you apply
# and review the change yourself.

# ── Pre-Commit Hooks ────────────────────────────────────────────────
pre-commit:
  commands:
    python-format:
      root: "python/"
      glob: "*.py"
      run: |
        uvx ruff format --check {staged_files} \
          || { echo "↳ run: uvx ruff format <files>  (then review & re-stage)" >&2; exit 1; }
    python-lint:
      root: "python/"
      glob: "*.py"
      run: |
        uvx ruff check {staged_files} \
          || { echo "↳ run: uvx ruff check --fix <files>  (then review & re-stage)" >&2; exit 1; }
    sql-lint:
      root: "."
      glob: "python/src/bursar/sql/*.sql"
      run: |
        uvx --from sqlfluff==4.2.2 sqlfluff lint {staged_files} --config .sqlfluff --nocolor \
        || { echo "↳ run: uvx --from sqlfluff==4.2.2 sqlfluff lint python/src/bursar/sql --config .sqlfluff" >&2; exit 1; }
    js-format:
      root: "javascript/"
      glob: "*.{ts,js,mjs,cjs}"
      run: |
        bunx --no-install oxfmt --config .oxfmtrc.json --check {staged_files} \
          || { echo "↳ run: bunx --no-install oxfmt --config .oxfmtrc.json --write <files>  (then review & re-stage)" >&2; exit 1; }
    js-lint:
      root: "javascript/"
      glob: "*.{ts,js,mjs,cjs}"
      run: |
        bunx --no-install oxlint --config .oxlintrc.json --deny-warnings {staged_files} \
          || { echo "↳ run: bunx --no-install oxlint --config .oxlintrc.json --fix <files>  (then review & re-stage)" >&2; exit 1; }
    go-format:
      root: "."
      glob: "**/*.go"
      run: |
        unformatted="$(gofmt -l {staged_files})"
        if [ -n "$unformatted" ]; then
          echo "Go source is not gofmt-formatted:" >&2
          echo "$unformatted" >&2
          echo "↳ run: gofmt -w <files>  (then review & re-stage)" >&2
          exit 1
        fi
    trailing-whitespace:
      run: git diff --cached --name-only --diff-filter=ACM | xargs -r git --no-pager diff --check --cached --
    merge-conflicts:
      run: |
        files=$(git diff --cached --name-only --diff-filter=ACM | grep -v '^lefthook\.yml$')
        if [ -z "$files" ]; then exit 0; fi
        if echo "$files" | xargs grep -l -E '^(<{7} |={7}|>{7})' > /dev/null 2>&1; then
          echo "Merge conflict markers found in staged files" >&2
          exit 1
        fi

# ── Pre-Push Hooks ──────────────────────────────────────────────────
pre-push:
  parallel: true
  commands:
    python-typecheck:
      root: "python/"
      glob: "{src,tests}/**/*.py"
      run: uv run pyright
    python-test:
      root: "python/"
      glob: "{src,tests}/**/*.py"
      run: uv run python -m pytest tests/ -q
    js-typecheck:
      root: "javascript/"
      glob: "src/**/*.ts"
      run: bun run typecheck
    js-test:
      root: "javascript/"
      glob: "src/**/*.ts"
      run: bun run test
    js-knip:
      root: "javascript/"
      glob: "src/**/*.ts"
      run: bun run knip
    go-vet:
      root: "golang/"
      glob: "{*.go,**/*.go,go.mod,go.sum}"
      run: go vet ./...
    go-test:
      root: "golang/"
      glob: "{*.go,**/*.go,go.mod,go.sum}"
      run: go test -race ./...
    erd-docs:
      root: "."
      glob: "{python/src/bursar/sql/*.sql,docs/scripts/generate_erd_docs.sh,docs/package.json,docs/package-lock.json}"
      run: cd docs && npm run generate:erd
